<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Roboto+Slab:wght@400;700&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --bg:#fdf9fa; --n-100:#f8f3f4; --n-200:#ece5e6; --n-500:#85787b; --n-600:#685c5e; --n-900:#1b1516;
  --pink:#ff007b; --pink-ink:#0e080a; --purple:#620073;
  --font-brand:'Raleway',system-ui,sans-serif; --font-inst:'Roboto Slab',Georgia,serif;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-brand);color:var(--n-900);background:var(--bg);}
.tabular{font-variant-numeric:lining-nums tabular-nums;}
.card{background:#ffffff;border-radius:14px;border:1px solid var(--n-200);box-shadow:0 1px 2px rgba(79,46,60,.05),0 6px 16px -6px rgba(79,46,60,.12);}
.btn-primary{background:var(--pink);color:var(--pink-ink);font-family:var(--font-brand);font-weight:700;font-size:16px;border:none;border-radius:12px;padding:15px;cursor:pointer;width:100%;}
</style>
</helmet>

<div style="width:390px;min-height:840px;background:var(--bg);display:flex;flex-direction:column;">

  <!-- header -->
  <div style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--n-200);background:#ffffff;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1b1516" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span style="font-family:var(--font-brand);font-weight:700;font-size:17px;">avaliar</span>
  </div>

  <div style="padding:24px 20px;display:flex;flex-direction:column;gap:22px;">

    <!-- contrato mini -->
    <div class="card" style="padding:14px;display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#fcd8e3,#c9a7c4);display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="#ff007b"><path transform="matrix(1,0,0,-1,10.1602,10.7793)" d="M0 0-6.907-2.597C-7.002-2.633-7.102-2.65-7.2-2.65-7.367-2.65-7.533-2.6-7.674-2.502-7.898-2.347-8.032-2.091-8.032-1.818V3.377C-8.032 3.649-7.898 3.905-7.674 4.061-7.449 4.216-7.163 4.252-6.907 4.155L0 1.558C.324 1.437 .539 1.126 .539 .779 .539 .433 .324 .122 0 0M7.972 2.777-7.271 6.675C-7.888 6.832-8.543 6.696-9.046 6.306-9.549 5.915-9.844 5.313-9.844 4.677V-3.118C-9.844-3.755-9.549-4.356-9.046-4.747-8.681-5.031-8.234-5.181-7.781-5.181-7.61-5.181-7.439-5.159-7.271-5.116L7.972-1.219C8.885-.985 9.523-.163 9.523 .779 9.523 1.722 8.885 2.544 7.972 2.777"/></svg>
      </div>
      <div>
        <div style="font-family:var(--font-inst);font-weight:700;font-size:13px;color:var(--n-900);">contrato concluído</div>
        <div style="font-family:var(--font-brand);font-size:12px;color:var(--n-600);">1 Reels · joão vitor</div>
      </div>
    </div>

    <div style="text-align:center;">
      <h1 style="font-family:var(--font-brand);font-weight:700;font-size:22px;margin:0 0 6px;color:var(--n-900);">como foi trabalhar com joão vitor?</h1>
      <p style="font-family:var(--font-brand);font-size:14px;color:var(--n-600);margin:0;">sua nota ajuda outras marcas e criadores</p>
    </div>

    <!-- stars -->
    <div style="display:flex;justify-content:center;gap:10px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="#ff007b"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="#ff007b"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="#ff007b"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="#ff007b"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z"/></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#dbd2d4" stroke-width="1.5"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z"/></svg>
    </div>

    <!-- comentario -->
    <div>
      <textarea style="width:100%;min-height:100px;font-family:var(--font-brand);font-size:16px;color:var(--n-900);border:1.5px solid var(--n-500);border-radius:10px;padding:14px;resize:none;" placeholder="conte como foi (opcional)"></textarea>
    </div>

    <!-- double-blind -->
    <div style="display:flex;gap:10px;background:#dbeafe;border-radius:12px;padding:14px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0112 5c5 0 9 4 10 7-0.4 1.2-1.3 2.7-2.6 4M6.6 6.6C4.3 8 2.8 10 2 12c1 3 5 7 10 7 1.4 0 2.7-.3 3.9-.8"/><path d="M9.5 9.9a3 3 0 004.2 4.2"/></svg>
      <span style="font-family:var(--font-brand);font-size:13px;color:#1d4ed8;line-height:1.5;">sua avaliação fica oculta até joão vitor avaliar também, ou até <span class="tabular" style="font-family:var(--font-inst);font-weight:700;">14/09/2026</span>. isso evita nota por represália.</span>
    </div>

  </div>

  <div style="margin-top:auto;padding:16px 20px 22px;background:#ffffff;border-top:1px solid var(--n-200);">
    <button class="btn-primary">enviar avaliação</button>
  </div>

</div>
</x-dc>
</body>
</html>
